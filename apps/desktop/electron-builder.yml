# Empacotamento Windows. O código vai em app.asar; o binário nativo do SQLite
# fica fora do asar, porque módulos .node não podem ser carregados de dentro dele.
appId: br.local.gestaopecuaria
productName: Gestão Pecuária
executableName: GestaoPecuaria
copyright: Uso pessoal

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# better-sqlite3 13 traz binário N-API pré-compilado. Não recompilar
# (a máquina não tem compilador C++ e não é necessário).
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: GestaoPecuaria-${version}-instalador.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Gestão Pecuária
  # Desinstalar não apaga os dados do usuário (ficam em %APPDATA%\GestaoPecuaria).
  deleteAppDataOnUninstall: false
